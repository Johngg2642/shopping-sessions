[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ahash = "0.8"
arrow-array = "57"
arrow-schema = "57"
hashbrown = "0.16"
memchr = "2"
memmap2 = "0.9"
parquet = { version = "57", default-features = false, features = ["arrow", "snap"] }
rayon = "1.11"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
